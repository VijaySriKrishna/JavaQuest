
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080D18">
    <title>Results | JavaQuest</title>

    <script>
        try {
            document.documentElement.dataset.theme =
                localStorage.getItem("javaquest-theme") === "light"
                    ? "light" : "dark";
        } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <script src="/theme.js" defer></script>

    <style>
        :root {
            color-scheme: dark;
            --bg: #080D18;
            --sidebar: #0B1220;
            --panel: #111C30;
            --panel-hover: #17243B;
            --border: #263750;
            --blue: #438BFF;
            --blue-hover: #2F75E8;
            --blue-soft: #14284B;
            --text: #F5F7FC;
            --muted: #9CAAC0;
            --shadow: 0 12px 32px rgba(0,0,0,.14);
        }

        html[data-theme="light"] {
            color-scheme: light;
            --bg: #F4F7FC;
            --sidebar: #FFFFFF;
            --panel: #FFFFFF;
            --panel-hover: #EDF3FC;
            --border: #DCE3ED;
            --blue: #246BFD;
            --blue-hover: #1858D9;
            --blue-soft: #E4EDFF;
            --text: #172033;
            --muted: #64748B;
            --shadow: 0 12px 32px rgba(25,45,80,.06);
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 24px 40px;
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", sans-serif;
            transition: background-color .2s, color .2s;
        }

        a { color: inherit; text-decoration: none; }

        .page {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand span { color: var(--blue); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Same toggle as dashboard.html */
        .theme-toggle {
            position: relative;
            width: 48px;
            height: 28px;
            padding: 3px;
            flex-shrink: 0;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--panel-hover);
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            transition: background .2s, border-color .2s;
        }

        .theme-toggle:hover { border-color: var(--blue); }

        .toggle-knob {
            position: absolute;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--blue);
            transition: transform .2s ease;
        }

        .toggle-icon {
            position: absolute;
            right: 5px;
            color: var(--text);
            font-size: 12px;
            line-height: 1;
        }

        html[data-theme="light"] .toggle-knob {
            transform: translateX(20px);
        }

        html[data-theme="light"] .toggle-icon {
            left: 7px;
            right: auto;
        }

        .theme-toggle:focus-visible,
        .account summary:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 3px;
        }

        .account { position: relative; }

        .account summary {
            cursor: pointer;
            list-style: none;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
            color: var(--text);
            font-size: 13px;
        }

        .account summary::-webkit-details-marker { display: none; }

        .menu {
            position: absolute;
            z-index: 10;
            top: calc(100% + 8px);
            right: 0;
            width: 175px;
            padding: 7px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .menu a {
            display: block;
            padding: 11px;
            border-radius: 8px;
            font-size: 13px;
        }

        .menu a:hover { background: var(--panel-hover); }

        .eyebrow {
            color: var(--blue);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .card {
            width: min(100%, 500px);
            margin: 35px auto;
            padding: 36px;
            text-align: center;
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .account-info {
            text-align: right;
            color: var(--muted);
            font-size: 12px;
        }

        h1 {
            margin: 25px 0 10px;
            font-size: clamp(27px, 5vw, 36px);
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .score {
            margin: 28px 0 8px;
            font-size: clamp(40px, 8vw, 52px);
            font-weight: 800;
            letter-spacing: -1px;
        }

        .score-total {
            color: var(--muted);
            font-size: 24px;
            font-weight: 500;
        }

        .percent {
            display: inline-block;
            margin-top: 8px;
            padding: 9px 14px;
            border-radius: 10px;
            background: var(--blue-soft);
            color: var(--blue);
            font-size: 17px;
            font-weight: 800;
        }

        .message {
            margin: 24px 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 26px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            border: 1px solid var(--blue);
            border-radius: 10px;
            background: var(--blue);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            transition: background .2s, transform .2s;
        }

        .button:hover {
            background: var(--blue-hover);
            border-color: var(--blue-hover);
            transform: translateY(-1px);
        }

        .button.secondary {
            background: var(--panel-hover);
            color: var(--text);
            border-color: var(--border);
        }

        .button.secondary:hover { border-color: var(--blue); }

        @media (max-width: 520px) {
            body { padding: 22px 16px; }
            .header-actions { gap: 8px; }
            .card { padding: 25px 18px; margin-top: 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
<div class="page">
    <header class="topbar">
        <a class="brand" th:href="@{/dashboard}">
            Java<span>Quest</span> ✦
        </a>

        <div class="header-actions">
            <button type="button" class="theme-toggle"
                    aria-label="Switch to light mode"
                    aria-pressed="true">
                <span class="toggle-icon" aria-hidden="true">☾</span>
                <span class="toggle-knob" aria-hidden="true"></span>
            </button>

            <details class="account">
                <summary>
                    ◉ <span th:text="${username}">Student</span> ▾
                </summary>
                <nav class="menu">
                    <a th:href="@{/dashboard}">Dashboard</a>
                    <a th:href="@{/quiz}">Take a quiz</a>
                    <a th:href="@{/history}">Quiz history</a>
                    <a th:href="@{/logout}">Sign out</a>
                </nav>
            </details>
        </div>
    </header>

    <main class="card">
        <div class="eyebrow">Quiz completed</div>

        <div class="account-info">
            Account: <strong th:text="${username}">Student</strong>
        </div>

        <h1>Quiz Completed!</h1>
        <p class="subtitle">Your JavaQuest results</p>

        <div class="score">
            <span th:text="${score}">3</span>
            <span class="score-total">
                / <span th:text="${total}">10</span>
            </span>
        </div>

        <div class="percent">
            <span th:text="${percentage}">30</span>% score
        </div>

        <p class="message" th:text="${message}">
            Keep practising. Every attempt makes you better!
        </p>

        <div class="buttons">
            <a class="button" th:href="@{/quiz}">Try Again →</a>
            <a class="button secondary" th:href="@{/history}">Quiz History</a>
            <a class="button secondary" th:href="@{/dashboard}">Dashboard</a>
        </div>
    </main>
</div>
</body>
</html>
